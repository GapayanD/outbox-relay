spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:postgresql://postgres:5432/orders?currentSchema=orders
    username: orders_svc
    password: orders
  flyway:
    schemas: orders
  rabbitmq:
    host: rabbitmq
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus