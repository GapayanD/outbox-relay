services:
  postgres: { image: "postgres:16", environment: { POSTGRES_DB: orders, POSTGRES_PASSWORD: postgres }, volumes: ["./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"] }
  redis: { image: "redis:7" }
  rabbitmq: { image: "rabbitmq:3.13-management", environment: { RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"' }, volumes: ["./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro"] }
  # next: orders-service, enrichment-service, prometheus, grafana
