name: orders-service

on:
  push:
    branches: [main]
    paths:
      - "orders-service/**"
      - "contracts/**"
      - ".github/workflows/orders-service.yml"
  pull_request:
    paths:
      - "orders-service/**"
      - "contracts/**"
      - ".github/workflows/orders-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test (Testcontainers uses the runner's Docker)
        run: mvn -B verify
